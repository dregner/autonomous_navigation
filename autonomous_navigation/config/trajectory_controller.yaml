# Tuning parameters for the trajectory_controller node.
# Loaded by launch/nav_controller.launch.py. Every value can also be changed live:
#   ros2 param set /navigation/trajectory_controller pid.forward.kp 1.2
/**:
  ros__parameters:
    control_rate_hz: 10.0        # control loop rate (try 20.0 if odom arrives >= 20 Hz)
    accept_radius: 0.3           # [m] waypoint acceptance radius
    odom_timeout: 0.5            # [s] send neutral sticks if odometry is older than this
    hold_final_position: true    # keep regulating on the last waypoint instead of going neutral
    yaw_mode: 0                  # 0 = hold initial yaw, 1 = look at the duct/path centre, 2 = yaw_fixed
    yaw_fixed: 0.0               # [rad] used when yaw_mode == 2
    twist_in_body_frame: true    # MAVROS local_position/odom publishes the twist in base_link

    # Efforts are normalized: 1.0 == full stick. out_max limits the authority per axis,
    # i_max limits the integral *contribution* to the effort.
    pid:
      forward: {kp: 0.8, ki: 0.10, kd: 0.30, i_max: 0.30, out_max: 0.60}
      lateral: {kp: 1.0, ki: 0.10, kd: 0.30, i_max: 0.30, out_max: 0.60}
      # ALT_HOLD: throttle stick == climb-rate set-point, ArduSub already closes the depth loop
      depth:   {kp: 1.0, ki: 0.05, kd: 0.00, i_max: 0.20, out_max: 0.60}
      # ALT_HOLD: yaw stick == yaw-rate set-point, ArduSub already damps the yaw rate
      yaw:     {kp: 0.3, ki: 0.00, kd: 0.00, i_max: 0.10, out_max: 0.40}

    # RC mapping. pwm = 1500 +/- (deadzone + |effort| * (max_pwm_delta - deadzone))
    # Dead-zones must match the ArduSub parameters RC5_DZ / RC6_DZ / RC4_DZ / THR_DZ.
    effort_eps: 0.02             # |effort| below this -> exactly 1500 (let ArduSub hold depth/heading)
    max_pwm_delta: 400           # 400 == full 1100..1900 range; lower it for a gentle first test (e.g. 250)
    deadzone:
      forward: 30
      lateral: 30
      yaw: 40
      throttle: 100
